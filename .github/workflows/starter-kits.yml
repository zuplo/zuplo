name: Starter Kits

on:
  push:
    branches: [main]
    paths:
      - "starter-kits/**"
      - ".github/workflows/starter-kits.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "starter-kits/**"
      - ".github/workflows/starter-kits.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (in-memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspaces
        run: npm install --no-save
      - name: Run all kit smoke tests + shared adapter tests
        run: npm run test:starter-kits
      - name: Verify two-layer MCP wiring
        run: node starter-kits/_shared/verify-mcp-layers.mjs

  typecheck:
    name: Type-check kits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-save
      - name: Type-check shared package
        run: npx tsc --noEmit --skipLibCheck -p starter-kits/_shared/tsconfig.json
      - name: Type-check template
        run: npx tsc --noEmit --skipLibCheck -p starter-kits/_template/tsconfig.json

  postgres-integration:
    name: Postgres integration (Repository<T> parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KIT_TEST_PG_URL: postgres://kit:kit@localhost:5432/kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-save
      - name: Run Postgres integration tests
        run: npx vitest run --root starter-kits/_shared adapters/postgres-integration.test.ts
        working-directory: ${{ github.workspace }}
