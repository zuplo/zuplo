name: Examples
on:
  push:
    branches:
      - main
    paths:
      - "examples/**"

permissions: {}

jobs:
  trigger-deploy:
    name: Refresh Examples
    runs-on: ubuntu-latest
    steps:
      # --fail so an HTTP error actually fails the job rather than reporting green.
      - run: curl --fail --silent --show-error --retry 3 "${{ secrets.EXAMPLES_DEPLOY_HOOK }}"
